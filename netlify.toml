[build]
  base    = "/"
  command = "npm run build -w packages/shared && npm run build -w client"
  publish = "client/dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # Ensure workspace devDependencies (tsc) install when NODE_ENV=production
  NPM_CONFIG_PRODUCTION = "false"
