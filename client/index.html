<!DOCTYPE html>
<html lang="en" style="font-family: 'Manrope', system-ui, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Muscle Land weekly leaderboard. See your rank, compare with other players, and track your prize pool rewards." />
    <meta name="theme-color" content="#5568f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/muscle-land-logo.png?v=2" />
    <link rel="apple-touch-icon" href="/muscle-land-logo.png?v=2" />
    <title>Muscle Land</title>
    <script>
      (function () {
        const stored = localStorage.getItem('panteon-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored ?? (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
